<style>
:root{
  --abyss:#050A14; --hull:#0A1120; --deck:#0E1829; --panel:#111F35;
  --line:#1D2E4C; --ice:#7FD7FF; --beam:#8AA6CC; --frost:#E8F1FB;
}
:root:not([data-theme="light"]){ color-scheme: dark; }
html,body{height:100%;}
body{
  margin:0; background:var(--abyss); color:var(--frost);
  font-family:Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* Faint polar grid wash behind the whole shell */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(1100px 700px at 78% -10%, rgba(56,189,248,.10), transparent 60%),
    radial-gradient(800px 600px at 0% 100%, rgba(45,212,191,.07), transparent 60%),
    repeating-linear-gradient(0deg, rgba(127,215,255,.035) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, rgba(127,215,255,.035) 0 1px, transparent 1px 64px);
}
#app{position:relative; z-index:1;}
*{scrollbar-width:thin; scrollbar-color:#28406B transparent;}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:#1D2E4C;border-radius:8px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#2C4573;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid #7FD7FF; outline-offset:2px; border-radius:4px}

.glass{background:linear-gradient(180deg, rgba(17,31,53,.92), rgba(10,17,32,.92)); backdrop-filter:blur(8px);}
.panel{background:rgba(14,24,41,.72); border:1px solid #1D2E4C;}
.panel-flat{background:#0E1829; border:1px solid #1D2E4C;}
.hairline{border-color:#1D2E4C}
.tick{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.cond{font-family:"Barlow Semi Condensed",Inter,sans-serif}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:#6E87AD}
.linkish{transition:color .15s ease, background-color .15s ease, border-color .15s ease}
.row-hover:hover{background:rgba(56,189,248,.055)}
.striped:nth-child(even){background:rgba(255,255,255,.012)}

.led{width:7px;height:7px;border-radius:99px;display:inline-block;flex:none}
.led-ok{background:#3FCF8E;box-shadow:0 0 0 3px rgba(63,207,142,.15)}
.led-warn{background:#F0A429;box-shadow:0 0 0 3px rgba(240,164,41,.15)}
.led-crit{background:#F0524D;box-shadow:0 0 0 3px rgba(240,82,77,.18)}
.led-info{background:#57A6F5;box-shadow:0 0 0 3px rgba(87,166,245,.15)}
.led-idle{background:#54698C;box-shadow:0 0 0 3px rgba(84,105,140,.15)}

@keyframes pulsering{0%{r:6;opacity:.85}70%{r:22;opacity:0}100%{r:22;opacity:0}}
.pulse-ring{animation:pulsering 2.2s ease-out infinite}
@keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
.blip{animation:blip 1.5s ease-in-out infinite}
@keyframes sweep{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sweep{transform-origin:center; animation:sweep 8s linear infinite}
@keyframes toastin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.toast{animation:toastin .18s ease-out}
@keyframes modalin{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-in{animation:modalin .16s ease-out}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}
.scroll-x{overflow-x:auto}
table{border-collapse:separate;border-spacing:0}
th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;color:#6E87AD;font-weight:500;text-align:left}
input,select,textarea{color-scheme:dark}
input::placeholder,textarea::placeholder{color:#5B7194}
.nav-active{background:linear-gradient(90deg, rgba(56,189,248,.16), rgba(56,189,248,.02)); color:#E8F1FB}
.nav-active .navbar-ind{opacity:1}
</style>

function lineChart(series, opts){
  opts=opts||{}; const w=opts.w||640, h=opts.h||180, pl=38, pr=12, pt=12, pb=22;
  const all=[].concat.apply([],series.map(s=>s.data));
  let min = opts.min!=null?opts.min:Math.min.apply(null,all), max = opts.max!=null?opts.max:Math.max.apply(null,all);
  if(min===max){max=min+1;} const span=max-min; min-=span*0.12; max+=span*0.12;
  const n=series[0].data.length;
  const X=i=> pl + (w-pl-pr)*(n===1?0.5:i/(n-1));
  const Y=v=> pt + (h-pt-pb)*(1-(v-min)/(max-min));
  let g='';
  for(let k=0;k<=4;k++){ const y=pt+(h-pt-pb)*k/4; const val=max-(max-min)*k/4;
    g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="#1D2E4C" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" fill="#6E87AD" font-size="9.5" font-family="IBM Plex Mono">'+(Math.abs(val)>=1000?Math.round(val/100)/10+'k':Math.round(val*10)/10)+'</text>';
  }
  series.forEach(s=>{
    const pts=s.data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    if(s.fill) g+='<polygon points="'+X(0).toFixed(1)+','+(h-pb)+' '+pts+' '+X(n-1).toFixed(1)+','+(h-pb)+'" fill="'+s.color+'" opacity=".10"/>';
    g+='<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.width||1.9)+'" stroke-linejoin="round" stroke-linecap="round" '+(s.dash?'stroke-dasharray="4 4"':'')+'/>';
    if(s.dots) s.data.forEach((v,i)=> g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.2" fill="'+s.color+'"/>');
  });
  if(opts.threshold!=null && opts.threshold>=min && opts.threshold<=max){
    g+='<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(opts.threshold).toFixed(1)+'" y2="'+Y(opts.threshold).toFixed(1)+'" stroke="#F0524D" stroke-width="1" stroke-dasharray="5 4"/>'+
       '<text x="'+(w-pr)+'" y="'+(Y(opts.threshold)-5).toFixed(1)+'" text-anchor="end" fill="#F0524D" font-size="9.5" font-family="IBM Plex Mono">'+esc(opts.thresholdLabel||'threshold')+'</text>';
  }
  (opts.labels||[]).forEach((l,i)=>{ if(!l) return;
    g+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" fill="#6E87AD" font-size="9.5" font-family="IBM Plex Mono">'+esc(l)+'</text>'; });
  return '<svg viewBox="0 0 '+w+' '+h+'" class="w-full h-auto" preserveAspectRatio="none" style="max-height:'+h+'px">'+g+'</svg>';
}

/* ===================== POLAR MAP ===================== */
function project(lat, lon, theatre, R, cx, cy){
  const a = lon*Math.PI/180;
  let r;
  if(theatre==='antarctic') r = clamp((lat+90)/60,0,1)*R;      // -90 .. -30
  else r = clamp((90-lat)/25,0,1)*R;                            // 90 .. 65
  if(theatre==='antarctic') return {x:cx + r*Math.sin(a), y:cy + r*Math.cos(a)};
  return {x:cx + r*Math.sin(a), y:cy - r*Math.cos(a)};
}
const coastSeed = mulberry32(9931);
function coastPath(cx,cy,R,scale,wob){
  let d='', pts=[];
  for(let i=0;i<56;i++){
    const a=i/56*Math.PI*2;
    const rr = R*scale*(1 + wob*Math.sin(a*3+1.2) + wob*0.7*Math.sin(a*5+.4) + wob*0.4*Math.sin(a*8+2.1));
    pts.push([cx+rr*Math.sin(a), cy+rr*Math.cos(a)]);
  }
  pts.forEach((p,i)=>{ d += (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1); });
  return d+'Z';
}

     '<radialGradient id="seafill" cx="50%" cy="50%"><stop offset="0%" stop-color="#091426"/><stop offset="100%" stop-color="#060D1A"/></radialGradient></defs>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#seafill)" stroke="#1D2E4C"/>';
  // latitude rings
  const ringLabels = th==='antarctic'?['80°S','70°S','60°S','50°S','40°S']:['85°N','80°N','75°N','70°N'];
  ringLabels.forEach((lbl,i)=>{
    const rr = R*( th==='antarctic' ? (10+i*10)/60 : (5+i*5)/25 );
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+rr.toFixed(1)+'" fill="none" stroke="#1D2E4C" stroke-dasharray="2 5"/>'+
       '<text x="'+(cx+4)+'" y="'+(cy-rr+11).toFixed(1)+'" fill="#43597E" font-size="8.5" font-family="IBM Plex Mono">'+lbl+'</text>';
  });
  for(let a=0;a<360;a+=30){
    const p=project(th==='antarctic'?-30:65, a, th, R, cx, cy);
    g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="#16253F" stroke-width="1"/>';
  }
  // landmass
  if(th==='antarctic'){
    g+='<path d="'+coastPath(cx,cy,R,0.42,0.13)+'" fill="url(#icefill)" stroke="#2A4568" stroke-width="1.2"/>';
    g+='<path d="'+coastPath(cx,cy,R,0.52,0.16)+'" fill="none" stroke="#1E344F" stroke-width="1" stroke-dasharray="3 4"/>';
    g+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="#2E4B70" font-size="10" font-family="Barlow Semi Condensed" letter-spacing="3">SOUTH POLE</text>';
  } else {
    g+='<path d="'+coastPath(cx,cy,R,0.78,0.10)+'" fill="none" stroke="#24405F" stroke-width="1" stroke-dasharray="4 5"/>';
    g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*0.46)+'" fill="url(#icefill)" opacity=".55" stroke="#2A4568" stroke-dasharray="6 5"/>';
    g+='<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="#2E4B70" font-size="10" font-family="Barlow Semi Condensed" letter-spacing="3">NORTH POLE</text>';
  }
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#28406B" stroke-dasharray="1 6"/>';
  // radar sweep
  g+='<g class="sweep" style="transform-origin:'+cx+'px '+cy+'px"><path d="M'+cx+' '+cy+' L'+(cx)+' '+(cy-R)+' A'+R+' '+R+' 0 0 1 '+(cx+R*0.42)+' '+(cy-R*0.9)+' Z" fill="#7FD7FF" opacity=".05"/></g>';

  // routes for current expedition
  const exp=expeditions.find(e=>e.id===state.expedition);
  if(exp && opts.route!==false){
    const pts = exp.route.map(r=>PLACES[r.place]).filter(p=>p&&p.theatre===th).map(p=>project(p.lat,p.lon,th,R,cx,cy));
    if(pts.length>1) g+='<polyline points="'+pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ')+'" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="6 4" opacity=".55"/>';
  }
  // entities
  const ents = mapEntities.filter(e=>e.theatre===th && state.mapLayers[e.kind]!==false);
  ents.forEach(e=>{
    const p=project(e.lat,e.lon,th,R,cx,cy);
    const sel = state.mapSel===e.id;
    g+='<g data-marker="'+esc(e.id)+'" style="cursor:pointer">'+entityIcon(e.kind,p.x,p.y,sel)+
       '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="13" fill="transparent"/>'+
       (e.kind==='station'||sel?'<text x="'+(p.x+9).toFixed(1)+'" y="'+(p.y+3.5).toFixed(1)+'" fill="'+(sel?'#E8F1FB':'#8AA6CC')+'" font-size="9.5" font-family="IBM Plex Mono">'+esc(e.name.replace(' Station',''))+'</text>':'')+'</g>';
  });
  if(state.mapLayers.incident!==false){
    incidents.filter(i=>i.stage<7).forEach(i=>{
      const pl=PLACES[i.location]; if(!pl||pl.theatre!==th) return;
      const p=project(pl.lat,pl.lon,th,R,cx,cy);
      g+='<g data-marker="'+esc(i.id)+'" style="cursor:pointer">'+entityIcon('incident',p.x,p.y,state.mapSel===i.id)+
         '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="14" fill="transparent"/></g>';
    });
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" class="w-full h-auto select-none" data-map="1">'+g+'</svg>';
}
function markerCard(id){
  const ent = mapEntities.find(e=>e.id===id);
  const inc = incidents.find(i=>i.id===id);
  if(inc){
    const p=personById(inc.personId);
    return infoCard('Incident '+inc.id, inc.type, [
      ['Severity', inc.severity],['Location', inc.location],['Stage', WORKFLOW[inc.stage]],
      ['Reported by', p?p.name:'Station sensor'],['Opened', dtfmt(inc.ts)]
    ], btn('Open in Emergency Centre','go',{kind:'danger',icon:'siren',data:{page:'emergency'}}), 'bad');
  }
  if(!ent) return '';
  if(ent.kind==='vessel'){
    const a=assets.find(x=>x.id===ent.id)||{};
    const crew=personnel.filter(p=>p.location.indexOf('Southern Ocean')>=0||p.location==='Prydz Bay Anchorage').length;
    const load=cargo.filter(c=>c.location==='ORV Sagar Nidhi').length;
    return infoCard('VESSEL '+ent.id, ent.name, [
      ['Status', a.status||'In Transit'],['Crew', crew],['Cargo aboard', load+' consignments'],
      ['Fuel', (a.fuel||74)+'%'],['Destination', 'Prydz Bay → Bharati Station'],['Position', ent.lat.toFixed(2)+'°S '+ent.lon.toFixed(2)+'°E']
    ], btn('Open asset record','go',{icon:'ship',data:{page:'assets',id:ent.id}}), 'warn');
  }
  if(ent.kind==='vehicle'){
    const a=assets.find(x=>x.id===ent.id)||{};
    return infoCard('VEHICLE '+ent.id, a.name||ent.name, [
      ['Status', a.status||'Operational'],['Condition', a.condition||'Good'],['Operating hours', fmt(a.hours)+' / '+fmt(a.threshold)],
      ['Fuel', (a.fuel||60)+'%'],['Location', a.location||'—']
    ], btn('Open asset record','go',{icon:'truck',data:{page:'assets',id:ent.id}}), 'info');
  }
  const here = personnel.filter(p=>p.location===ent.name);
  const stock = inventory.filter(i=>i.location===ent.name);
  const crit = stock.filter(i=>invStatus(i)==='Critical').length;
  return infoCard(ent.kind==='camp'?'FIELD CAMP':'FACILITY', ent.name, [
    ['Personnel on site', here.length],['Inventory lines', stock.length],['Critical stock lines', crit],
    ['Assets', assets.filter(a=>a.location===ent.name).length],
    ['Coordinates', Math.abs(ent.lat).toFixed(2)+'°'+(ent.lat<0?'S':'N')+' '+Math.abs(ent.lon).toFixed(2)+'°'+(ent.lon<0?'W':'E')]
  ], btn('View personnel here','go',{icon:'users',data:{page:'personnel'}}), crit?'warn':'ok');
}
function infoCard(eyebrow, title, rows, action, tone){
  const bar={ok:'bg-moss',warn:'bg-amber1',bad:'bg-crimson',info:'bg-glacier'}[tone]||'bg-line2';
  return '<div class="relative panel-flat rounded-[3px] p-3.5">'+
    '<span class="absolute left-0 top-0 h-full w-[2px] '+bar+'"></span>'+
    '<div class="eyebrow">'+esc(eyebrow)+'</div>'+
    '<div class="cond text-[17px] font-600 text-frost mt-0.5 mb-2.5">'+esc(title)+'</div>'+
    '<dl class="space-y-1.5">'+rows.map(r=>'<div class="flex justify-between gap-3 text-[12.5px]"><dt class="text-beam">'+esc(r[0])+'</dt><dd class="tick text-frost text-right">'+esc(r[1])+'</dd></div>').join('')+'</dl>'+
    (action?'<div class="mt-3">'+action+'</div>':'')+'</div>';
}

    const avg=Math.round(Object.keys(e.health).reduce((s,k)=>s+e.health[k],0)/5);

    return '<div class="grid xl:grid-cols-3 gap-4">'+
      '<div class="panel rounded-[3px] p-4">'+sectionHead('Expedition health','Composite readiness index','')+

        '<div class="space-y-2.5">'+Object.keys(e.health).map(k=>healthBar(k.charAt(0).toUpperCase()+k.slice(1),e.health[k])).join('')+'</div></div>'+
      '<div class="panel rounded-[3px] p-4 xl:col-span-2">'+sectionHead('Objective &amp; scope','')+

        [['Personnel',personnel.filter(p=>p.expeditionId===e.id).length,'users'],
         ['Cargo lines',cargo.filter(c=>c.expeditionId===e.id).length,'package'],
         ['Assets',assets.filter(a=>a.expeditionId===e.id).length,'truck'],
         ['Missions',missions.filter(m=>m.expeditionId===e.id).length,'compass']]
        .map(x=>'<div class="panel-flat rounded-[3px] p-3"><div class="flex items-center gap-2 text-beam">'+ic(x[2],'w-3.5 h-3.5')+'<span class="eyebrow">'+x[0].toUpperCase()+'</span></div>'+
          '<div class="tick text-[24px] text-frost mt-1.5">'+x[1]+'</div></div>').join('')+'</div>'+
        '<div class="eyebrow mb-2">OPEN RISKS</div>'+
        '<div class="space-y-2">'+ea.map(a=>'<div class="flex items-start gap-2.5 text-[12.5px]"><span class="led '+LEVEL_LED[a.level]+' mt-[6px]"></span><span class="text-frost">'+esc(a.title)+'</span></div>').join('')+'</div>'+
      '</div></div>';
  }
  if(tab==='personnel'){
    const list=personnel.filter(p=>p.expeditionId===e.id);

        esc(p.role), esc(p.team), esc(p.location), statusChip(isOverdue(p)?'Critical':p.status), '<span class="tick text-beam">'+tfmt(p.lastCheckIn)+'</span>']),
      list.length+' assigned · showing first 40');
  }
  if(tab==='cargo'){
    const list=cargo.filter(c=>c.expeditionId===e.id);
    return dataTable(['Cargo ID','Item','Category','Weight','Location','Status','ETA'],
      list.map(c=>['<button data-act="cargo-open" data-id="'+c.id+'" class="tick text-ice hover:underline">'+c.id+'</button>', esc(c.item), esc(c.category),
        '<span class="tick">'+fmt(c.weight)+' kg</span>', esc(c.location), statusChip(c.status), '<span class="tick text-beam">'+dfmt(c.eta)+'</span>']),
      list.length+' consignments · '+fmt(list.reduce((s,c)=>s+c.weight,0))+' kg total');
  }
  if(tab==='inventory'){
    const list=inventory.filter(i=>i.location===e.base || i.location.indexOf('Camp')>=0);
    return dataTable(['Item','Category','Stock','Threshold','Days cover','Status'],
      list.map(i=>[esc(i.name), esc(i.category), '<span class="tick">'+fmt(Math.round(i.qty))+' '+i.unit+'</span>',
        '<span class="tick text-beam">'+fmt(i.min)+'</span>','<span class="tick">'+invDays(i).toFixed(1)+'</span>', statusChip(invStatus(i))]),
      list.length+' stock lines held for this expedition');
  }
  if(tab==='assets'){
    const list=assets.filter(a=>a.expeditionId===e.id);
    return dataTable(['Asset ID','Name','Type','Location','Hours','Condition','Status'],
      list.map(a=>['<button data-act="asset-open" data-id="'+a.id+'" class="tick text-ice hover:underline">'+a.id+'</button>', esc(a.name), esc(a.type), esc(a.location),
        '<span class="tick">'+fmt(a.hours)+' / '+fmt(a.threshold)+'</span>', statusChip(a.condition), statusChip(a.status)]),
      list.length+' assets allocated');
  }
  if(tab==='missions'){
    const list=missions.filter(m=>m.expeditionId===e.id);
    return '<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-3">'+(list.length?list.map(m=>
      '<div class="panel rounded-[3px] p-3.5">'+
      '<div class="flex items-start justify-between gap-2"><div><div class="eyebrow">'+m.id+' · '+esc(m.discipline.toUpperCase())+'</div>'+

      '<div class="text-[12px] text-beam mt-2">'+esc(m.site)+' · due '+dfmt(m.due)+'</div>'+
      '<div class="mt-2.5 h-[5px] bg-white/6 rounded-sm overflow-hidden"><div class="h-full '+(m.state==='Blocked'?'bg-crimson/70':'bg-aurora/70')+'" style="width:'+m.progress+'%"></div></div>'+
      '<div class="flex justify-between text-[11px] text-beam mt-1.5"><span>'+esc(m.leadRole)+'</span><span class="tick">'+m.progress+'%</span></div>'+
      '</div>').join(''):emptyState('No missions defined yet','Use Assign resources to add the first mission.'))+'</div>';
  }
  if(tab==='route'){
    return '<div class="grid xl:grid-cols-[1fr_380px] gap-4">'+
      '<div class="panel rounded-[3px] p-4">'+sectionHead('Planned route','Sequential legs with clearance state','')+
      '<ol class="relative pl-6">'+e.route.map((r,i)=>
        '<li class="relative pb-5 last:pb-0">'+
        (i<e.route.length-1?'<span class="absolute left-[-15px] top-4 bottom-0 w-px bg-line"></span>':'')+
        '<span class="absolute left-[-19px] top-1 w-2.5 h-2.5 rounded-full border-2 '+(r.state==='Cleared'?'bg-moss border-moss':'bg-hull border-line2')+'"></span>'+
        '<div class="flex items-center justify-between gap-3 flex-wrap"><span class="text-[13.5px] text-frost">'+pad(r.seq)+' · '+esc(r.place)+'</span>'+statusChip(r.state)+'</div>'+
        '<div class="tick text-[11.5px] text-beam mt-0.5">ETA '+dfmt(r.eta)+' · '+(PLACES[r.place]?Math.abs(PLACES[r.place].lat).toFixed(2)+'°'+(PLACES[r.place].lat<0?'S':'N'):'—')+'</div>'+
        '</li>').join('')+'</ol></div>'+
      '<div class="panel rounded-[3px] p-3"><div class="rounded-[3px] border border-line bg-hull/60 p-1">'+polarMap({w:520,h:420})+'</div></div>'+
    '</div>';
  }
  if(tab==='alerts'){
    return '<div class="grid md:grid-cols-2 gap-3">'+alerts.slice(0,10).map(alertRow).join('')+'</div>';
  }
  const acts=[
    ['Cargo CGO-1024 placed on weather hold at Cape Town','Cargo Control', NOW-2*HOUR],
    ['Response team RT-ALPHA dispatched to Field Camp Bravo','Emergency Centre', NOW-44*60000],
    ['Fuel reading logged at Maitri: 8 500 L','Station Engineering', NOW-5*HOUR],
    ['Mission MSN-104 marked in progress','Science Coordination', NOW-8*HOUR],
    ['12 personnel checked in at Maitri Station','Personnel Tracking', NOW-9*HOUR],
    ['Generator G-04 crossed 900 operating hours','Predictive Maintenance', NOW-26*HOUR],
    ['Blizzard warning issued for Dronning Maud Land','Meteorology', NOW-31*HOUR],
    ['ORV Sagar Nidhi cleared 63°S waypoint','Navigation', NOW-40*HOUR]
  ];
  return '<div class="panel rounded-[3px] p-4"><ol class="relative pl-5">'+acts.map((a,i)=>
    '<li class="relative pb-4 last:pb-0">'+(i<acts.length-1?'<span class="absolute left-[-13px] top-3.5 bottom-0 w-px bg-line"></span>':'')+

    '<div class="text-[13px] text-frost leading-snug">'+esc(a[0])+'</div>'+
    '<div class="tick text-[11px] text-beam mt-0.5">'+esc(a[1])+' · '+dtfmt(a[2])+'</div></li>').join('')+'</ol></div>';
}

function qrSvg(seed){
  const r=mulberry32(seed.split('').reduce((a,c)=>a+c.charCodeAt(0),7));
  const N=21, cell=6, s=N*cell;
  let g='<rect width="'+s+'" height="'+s+'" fill="#E8F1FB"/>';
  function finder(ox,oy){
    g+='<rect x="'+ox*cell+'" y="'+oy*cell+'" width="'+7*cell+'" height="'+7*cell+'" fill="#050A14"/>'+
       '<rect x="'+(ox+1)*cell+'" y="'+(oy+1)*cell+'" width="'+5*cell+'" height="'+5*cell+'" fill="#E8F1FB"/>'+
       '<rect x="'+(ox+2)*cell+'" y="'+(oy+2)*cell+'" width="'+3*cell+'" height="'+3*cell+'" fill="#050A14"/>';
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const inF = (x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
    if(inF) continue;
    if(r()>0.52) g+='<rect x="'+x*cell+'" y="'+y*cell+'" width="'+cell+'" height="'+cell+'" fill="#050A14"/>';
  }
  finder(0,0); finder(N-7,0); finder(0,N-7);
  return '<svg viewBox="0 0 '+s+' '+s+'" class="w-[126px] h-[126px] rounded-[2px]">'+g+'</svg>';
}

function sosFlow(){
  const person = personnel.filter(isOverdue)[0] || personnel.find(p=>p.status==='On Mission') || personnel[0];
  const loc = person.location;
  const team = RESPONSE_TEAMS.find(t=>t.ready) || RESPONSE_TEAMS[0];
  const veh = assets.filter(a=>a.type==='Snow Vehicle'&&a.status==='Operational')[0];
  const kit = inventory.find(i=>i.category==='Medical'&&i.qty>0);
  const id='INC-'+ri(4420,4499);
  const inc={ id:id, type:'SOS — Personnel Distress', severity:'Critical', location:loc, personId:person.id,
    ts:NOW, stage:4, team:team.id, vehicle:veh?veh.id:null,
    summary:'SOS beacon activated by '+person.name+' at '+loc+'. Automatic triage assigned '+team.name+' and '+(veh?veh.id:'no vehicle')+'.',
    log:[] };
  for(let k=0;k<=4;k++) inc.log.push({ts:NOW+k*12000, text:WORKFLOW[k], by:'SOS automation'});

  openModal(

     '<button data-act="close-modal" class="ml-auto text-beam hover:text-frost p-1">'+ic('x','w-5 h-5')+'</button></div>'+

function generateReport(kind){
  const L=[]; const rule='─'.repeat(62);
  const exp=expeditions.find(e=>e.id===state.expedition);
  L.push('NATIONAL CENTRE FOR POLAR AND OCEAN RESEARCH');
  L.push('Ministry of Earth Sciences · PolarOps command platform');
  L.push(rule);
  const titles={sitrep:'DAILY SITUATION REPORT',cargo:'CARGO MANIFEST',inv:'INVENTORY AND DEPLETION REPORT',maint:'MAINTENANCE FORECAST',safety:'SAFETY AND INCIDENT SUMMARY',season:'SEASON CLOSURE REPORT'};
  L.push(titles[kind]);
  L.push('Generated '+dtfmt(NOW)+' · Expedition '+exp.code+' · '+exp.destination);
  L.push(rule); L.push('');
  if(kind==='sitrep'||kind==='season'){
    L.push('1. OPERATIONAL SUMMARY');
    L.push('   Active expeditions ............ '+expeditions.filter(e=>e.status==='Active').length);
    L.push('   Personnel deployed ............ '+personnel.length);
    L.push('   Cargo in transit .............. '+cargo.filter(c=>c.status==='In Transit').length+' consignments');
    L.push('   Operational assets ............ '+assets.filter(a=>a.status==='Operational').length+' of '+assets.length);
    L.push('   Open incidents ................ '+incidents.filter(i=>i.stage<7).length);
    L.push('   Inventory lines at risk ....... '+inventory.filter(i=>invStatus(i)!=='Healthy').length);
    L.push('');
    L.push('2. OPEN ALERTS');
    alerts.slice(0,8).forEach(a=> L.push('   ['+a.level.toUpperCase().slice(0,4)+'] '+a.title));
    L.push('');
    L.push('3. EXPEDITION HEALTH — '+exp.code);
    Object.keys(exp.health).forEach(k=> L.push('   '+(k+' ').padEnd(16,'.')+' '+exp.health[k]+'%'));
  }
  if(kind==='cargo'){
    L.push('CONSIGNMENT LISTING ('+cargo.length+' lines, '+fmt(cargo.reduce((s,c)=>s+c.weight,0))+' kg)');
    L.push('');
    L.push('ID           WEIGHT     STATUS        DESTINATION');
    cargo.slice(0,30).forEach(c=> L.push(c.id.padEnd(13)+(fmt(c.weight)+' kg').padEnd(11)+c.status.padEnd(14)+c.destination));
    L.push('');
    L.push('Delayed consignments: '+cargo.filter(c=>c.status==='Delayed').map(c=>c.id).join(', '));
  }
  if(kind==='inv'){
    L.push('ITEM                          LOCATION            STOCK      DAYS   STATUS');
    inventory.forEach(i=> L.push(i.name.slice(0,29).padEnd(30)+i.location.slice(0,19).padEnd(20)+(fmt(Math.round(i.qty))+' '+i.unit).padEnd(11)+invDays(i).toFixed(1).padEnd(7)+invStatus(i)));
    L.push('');
    L.push('Resupply pull recommended for '+inventory.filter(i=>invStatus(i)==='Critical').length+' lines before 17 Jan 2028.');
  }
  if(kind==='maint'){
    L.push('ASSET    NAME                      HOURS / THRESHOLD   REMAINING   NEXT SERVICE');
    assets.slice().sort((a,b)=>assetRemaining(a)-assetRemaining(b)).slice(0,20).forEach(a=>
      L.push(a.id.padEnd(9)+a.name.slice(0,25).padEnd(26)+(fmt(a.hours)+' / '+fmt(a.threshold)).padEnd(20)+(assetRemaining(a)+' h').padEnd(12)+dfmt(a.nextMaint)));
  }
  if(kind==='safety'){
    L.push('INCIDENT REGISTER');
    incidents.forEach(i=>{
      L.push('   '+i.id+'  '+i.type+' — '+i.location);
      L.push('      Severity '+i.severity+' · opened '+dtfmt(i.ts)+' · stage: '+(i.stage>=7?'Resolved':WORKFLOW[i.stage]));
      L.push('      '+i.summary);
    });
    L.push('');
    L.push('Median dispatch time: 14 minutes. Lost-time incidents this season: 0.');
  }
  L.push(''); L.push(rule);
  L.push('Prepared by PolarOps · '+exp.lead+' · all figures from simulated operational data.');
  state.reportOut={title:titles[kind], body:L.join('\n')};
  render(); toast('Report generated.');
}

/* ===================== AI COPILOT ===================== */
const SUGGESTED=[
  'What is the biggest operational risk right now?',
  'How many days of fuel do we have at Maitri?',
  'Which cargo is delayed and what does it block?',
  'Who has not checked in?',
  'Which assets need maintenance this week?',
  'Summarise the state of ISEA-44.'
];
function copilotAnswer(q){
  const t=q.toLowerCase();
  const fuel=inventory.find(i=>i.name==='Polar diesel (ATK)'&&i.location==='Maitri Station');
  if(/fuel|diesel|litre|liter/.test(t)){
    const d=invDays(fuel);
    return {text:'Maitri holds '+fmt(Math.round(fuel.qty))+' L of polar diesel against a 21-day average burn of '+fuel.daily+' L/day, which is '+d.toFixed(1)+' days of cover. The safety floor of '+fmt(fuel.min)+' L is reached in about '+Math.round((fuel.qty-fuel.min)/fuel.daily)+' days — before the 17 January resupply. Burn is running 14% above the planned 544 L/day because both generators are online for the power retrofit. Dropping to single-generator operation outside working hours recovers roughly 4 days of cover.',
      go:{page:'inventory',label:'Open fuel forecast'}};
  }
  if(/delay|cargo|shipment|consign/.test(t)){
    const d=cargo.filter(c=>c.status==='Delayed');
    return {text:d.length+' consignments are delayed. The one that matters is '+d[0].id+' ('+d[0].item+'), held at '+d[0].location+' with a revised arrival of '+dfmt(d[0].eta)+'. It is the drill head for MSN-101 at Field Camp Bravo, so a slip past 28 December costs that mission its weather window. The rest are spare parts with slack in the schedule.',
      go:{page:'cargo',label:'Open cargo control'}};
  }
  if(/check.?in|overdue|missing|not checked/.test(t)){
    const od=personnel.filter(isOverdue);
    return {text: od.length? od.length+' people are past their check-in window: '+od.map(p=>p.name+' at '+p.location+' (expected '+tfmt(p.expectedCheckIn)+')').join('; ')+'. All three are in the Field Camp Bravo / Route 04 area, which lost VHF coverage when the repeater failed under INC-4416. That points at a comms fault rather than three independent personnel events, but rule PCA-02 keeps them escalated until voice contact is confirmed.'
      :'Everyone deployed has checked in inside their window.', go:{page:'personnel',label:'Open personnel tracking'}};
  }
  if(/maint|service|asset|vehicle|generator/.test(t)){
    const due=assets.filter(a=>assetRemaining(a)<=150).sort((a,b)=>assetRemaining(a)-assetRemaining(b));
    return {text: due.length+' assets are within 150 operating hours of a service point. The binding one is '+due[0].id+' '+due[0].name+' at '+due[0].location+' with '+assetRemaining(due[0])+' hours left. Servicing it during the blizzard hold on 15–16 December costs nothing operationally, because field tasking is suspended anyway.',
      go:{page:'assets',label:'Open maintenance plan'}};
  }
  if(/risk|worry|concern|biggest|priority|attention/.test(t)){
    return {text:'Three things, in order. First, fuel at Maitri: '+invDays(fuel).toFixed(1)+' days of cover with burn 14% above plan, and the resupply is 34 days out. Second, the delayed drill head CGO-SCI-1024, which is the only item on the critical path for two ice-core missions. Third, generator G-04 at 920 of 950 hours during a retrofit that needs dual-generator supply. The fuel and the generator interact: single-generator operation saves fuel but removes the redundancy the retrofit relies on.',
      go:{page:'insights',label:'Open smart insights'}};
  }
  if(/emergency|incident|sos|medical|rescue/.test(t)){
    const open=incidents.filter(i=>i.stage<7);
    return {text: open.length+' incidents are open. The critical one is '+open[0].id+', a '+open[0].type.toLowerCase()+' at '+open[0].location+', currently at "'+WORKFLOW[open[0].stage]+'" with '+(RESPONSE_TEAMS.find(t2=>t2.id===open[0].team)||{name:'no team'}).name+' responding. Elapsed time is '+Math.round((NOW-open[0].ts)/60000)+' minutes.',
      go:{page:'emergency',label:'Open emergency centre'}};
  }
  if(/isea|expedition|summar|status of/.test(t)){
    const e=expeditions.find(x=>x.id===state.expedition);
    const avg=Math.round(Object.keys(e.health).reduce((s,k)=>s+e.health[k],0)/5);
    return {text:e.code+' — '+e.name+' — is '+e.status.toLowerCase()+', running '+dfmt(e.start)+' to '+dfmt(e.end)+' out of '+e.base+'. Composite health is '+avg+'%, held back by inventory at '+e.health.inventory+'%. It carries '+personnel.filter(p=>p.expeditionId===e.id).length+' people, '+cargo.filter(c=>c.expeditionId===e.id).length+' cargo lines and '+assets.filter(a=>a.expeditionId===e.id).length+' assets. '+missions.filter(m=>m.expeditionId===e.id&&m.state==='Blocked').length+' missions are currently blocked.',
      go:{page:'expeditions',label:'Open expedition'}};
  }
  if(/weather|blizzard|wind|storm/.test(t)){
    return {text:'A katabatic surge is forecast from 06:00 tomorrow through about 22:00, with gusts to 78 knots and visibility below 100 metres over Dronning Maud Land. Field movement should be suspended for roughly 16 hours. That removes about 16 working hours from the cargo discharge window, so fuel and medical pallets should be landed ahead of spare-part containers.',
      go:{page:'live',label:'Open live operations'}};
  }
  if(/personnel|people|crew|how many/.test(t)){
    return {text: personnel.length+' people are deployed across '+expeditions.filter(e=>e.status==='Active').length+' active expeditions: '+
      ['Science','Engineering','Medical','Logistics','Vessel','Safety','Support'].map(g=>personnel.filter(p=>p.group===g).length+' '+g.toLowerCase()).join(', ')+'. '+
      personnel.filter(p=>p.status==='On Mission').length+' are currently on mission away from their base.', go:{page:'personnel',label:'Open directory'}};
  }
  return {text:'I can work from the live operational picture — fuel and consumable cover, cargo movement and delays, personnel check-ins, asset maintenance, open incidents, weather impact, and expedition health. Ask me about any of those and I will answer from current data rather than generalities.', go:null};
}

/* ===================== ROUTER ===================== */
const PAGES={ command:pageCommand, expeditions:pageExpeditions, expedition:pageExpedition, live:pageLive,
  cargo:pageCargo, inventory:pageInventory, personnel:pagePersonnel, assets:pageAssets, emergency:pageEmergency,
  insights:pageInsights, analytics:pageAnalytics, reports:pageReports, copilot:pageCopilot, settings:pageSettings };
let lastScroll=0;
function render(keepScroll){
  const v=$('#view'); const sc=v.scrollTop;
  renderSidebar(); renderTopbar();
  v.innerHTML = (PAGES[state.page]||pageCommand)();
  v.scrollTop = keepScroll ? sc : 0;
  const cl=$('#copilot-log'); if(cl) cl.scrollTop=cl.scrollHeight;
}
function go(page, params){
  state.page=page; state.params=params||{}; state.notifOpen=false; state.sidebarOpen=false;
  if(page!=='expedition') state.expTab='overview';
  render();
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', function(ev){
  const marker = ev.target.closest('[data-marker]');
  if(marker){ state.mapSel = marker.getAttribute('data-marker'); render(true); return; }
  const el = ev.target.closest('[data-act]');
  if(!el){
    if(!ev.target.closest('[data-stop]') && state.notifOpen){ state.notifOpen=false; render(true); }
    const sr=$('#searchresults'); if(sr && !ev.target.closest('#globalsearch')) sr.classList.add('hidden');
    return;
  }
  const act=el.getAttribute('data-act');
  const id=el.getAttribute('data-id');
  switch(act){
    case 'noop': break;
    case 'toggle-sidebar': state.sidebarOpen=!state.sidebarOpen; render(true); break;
    case 'close-sidebar': state.sidebarOpen=false; render(true); break;
    case 'go': go(el.getAttribute('data-page'), id?{id:id}:{}); break;
    case 'go-expeditions': go('expeditions'); break;
    case 'go-personnel': go('personnel'); break;
    case 'go-cargo': go('cargo'); break;
    case 'go-assets': go('assets'); break;
    case 'go-inventory': go('inventory'); break;
    case 'go-emergency': go('emergency'); break;
    case 'notif': state.notifOpen=!state.notifOpen; render(true); break;
    case 'profile': toast('Signed in as '+(expeditions.find(e=>e.id===state.expedition)||{}).lead+' · Expedition Leader.'); break;
    case 'modal-backdrop': if(ev.target===el) closeModal(); break;
    case 'close-modal': closeModal(); break;
    case 'refresh': refreshSignals(); render(true); toast('Operational feed refreshed.'); break;
    case 'theatre': state.mapTheatre=el.getAttribute('data-t'); state.mapSel=null; render(true); break;
    case 'marker': state.mapSel=id; render(true); break;
    case 'alertfilter': state.alertFilter=el.getAttribute('data-f'); render(true); break;
    case 'ack': state.acked[id]=true; refreshSignals(); persist(); render(true); break;
    case 'ack-all': alerts.forEach(a=>state.acked[a.id]=true); refreshSignals(); persist(); render(true); toast('All alerts acknowledged.'); break;

    /* expeditions */
    case 'exp-new': openModal(expForm(null),'max-w-3xl'); break;
    case 'exp-edit': openModal(expForm(expeditions.find(e=>e.id===id)),'max-w-3xl'); break;
    case 'exp-open': go('expedition',{id:id}); break;
    case 'exptab': state.expTab=el.getAttribute('data-t'); render(true); break;
    case 'exp-archive': {
      const e=expeditions.find(x=>x.id===id); e.status='Archived'; render(true); toast(e.code+' archived.','warn'); break; }
    case 'exp-restore': {
      const e=expeditions.find(x=>x.id===id); e.status='Active'; render(true); toast(e.code+' restored to active.'); break; }
    case 'save-expedition': {
      const form=el.closest('form'); const d={};
      Array.prototype.forEach.call(form.querySelectorAll('[name]'), i=> d[i.name]=i.value);
      const eid=form.getAttribute('data-id');
      if(!d.name){ toast('An expedition needs a name.','bad'); break; }
      if(eid){ const e=expeditions.find(x=>x.id===eid);
        Object.assign(e,{name:d.name,code:d.code||e.code,destination:d.destination,region:d.region,lead:d.lead,status:d.status,objective:d.objective,
          start:d.start?new Date(d.start).getTime():e.start, end:d.end?new Date(d.end).getTime():e.end});
        toast(e.code+' updated.');
      } else {
        const ne={id:uid('EXP'), code:d.code||'NEW-01', name:d.name, status:d.status||'Planning', destination:d.destination||'—',
          region:d.region||'Antarctic', start:d.start?new Date(d.start).getTime():NOW, end:d.end?new Date(d.end).getTime():NOW+90*DAY,
          lead:d.lead||'Unassigned', objective:d.objective||'Objective to be defined.', base:d.destination||'—',
          health:{logistics:40,personnel:35,inventory:45,assets:50,safety:85}, route:[]};
        expeditions.push(ne); toast(ne.code+' created.');
      }
      closeModal(); render(true); break; }
    case 'exp-assign': openModal(modalHead('Assign resources', 'Attach personnel, cargo, assets and missions to this expedition')+
      '<div class="p-5 grid sm:grid-cols-2 gap-3">'+
      [['Personnel','Pick from the 126-strong deployment pool','users'],['Cargo','Link consignments already in the chain','package'],
       ['Assets','Allocate vessels, vehicles and equipment','truck'],['Missions','Define scientific and engineering tasking','compass']]
      .map(x=>'<button data-act="assign-do" data-what="'+x[0]+'" class="panel-flat rounded-[3px] p-4 text-left hover:border-line2 linkish">'+
        '<span class="text-ice">'+ic(x[2],'w-4 h-4')+'</span><div class="cond text-[16px] text-frost mt-2">'+x[0]+'</div>'+
        '<div class="text-[11.5px] text-beam mt-1">'+x[1]+'</div></button>').join('')+'</div>'+
      '<div class="flex justify-end px-5 py-4 border-t border-line">'+btn('Close','close-modal')+'</div>'); break;
    case 'assign-do': closeModal(); toast(el.getAttribute('data-what')+' assignment recorded against the expedition.'); break;

    /* cargo */
    case 'cargo-open': cargoModal(id); break;
    case 'cargo-status': state.cargo.status = state.cargo.status===el.getAttribute('data-s')?'All':el.getAttribute('data-s'); render(true); break;
    case 'cargo-clear': state.cargo={q:'',status:'All',prio:'All',exp:'All'}; render(true); break;
    case 'cargo-new': openModal(modalHead('Add consignment','Registers a new cargo line and issues a tracking tag')+
      '<div class="p-5 grid sm:grid-cols-2 gap-4">'+
      ['Item description','Category','Weight (kg)','Destination'].map(l=>'<label class="block"><span class="eyebrow block mb-1.5">'+l.toUpperCase()+'</span>'+
        '<input class="w-full bg-deck border border-line rounded px-3 py-2 text-[13px]" placeholder="'+esc(l)+'"/></label>').join('')+'</div>'+
      '<div class="flex justify-end gap-2 px-5 py-4 border-t border-line">'+btn('Cancel','close-modal')+btn('Register consignment','cargo-save',{kind:'primary',icon:'check'})+'</div>'); break;
    case 'cargo-save': closeModal(); toast('Consignment registered and tracking tag issued.'); break;
    case 'cargo-qr': toast('QR tag regenerated for '+id+'. Scan at the next handover point.'); break;
    case 'cargo-advance': {
      const c=cargo.find(x=>x.id===id);
      const order=['Planned','Packed','Dispatched','In Transit','Arrived','Verified','Stored'];
      let i=order.indexOf(c.status); if(c.status==='Delayed') i=order.indexOf('In Transit');
      c.status = order[Math.min(order.length-1,i+1)];
      c.stage = Math.min(4, {'Planned':0,'Packed':0,'Dispatched':1,'In Transit':2,'Arrived':3,'Verified':3,'Stored':4}[c.status]);
      c.history.forEach((h,k)=> h.done = k<=c.stage);
      refreshSignals(); cargoModal(id); render(true); toast(c.id+' advanced to '+c.status+'.'); break; }

    /* inventory */
    case 'inv-open': invModal(id); break;
    case 'inv-resupply': closeModal(); toast('Resupply request raised with the Logistics Cell.','warn'); break;
    case 'inv-model': toast('Modelled single-generator operation: cover extends from 13.7 to 17.9 days.'); break;
    case 'inv-consume': toast('Open any stock line to record receipts or consumption.'); break;
    case 'inv-add': case 'inv-sub': {
      const it=inventory.find(x=>x.id===id);
      const inp=document.querySelector('[data-inv-amt="'+id+'"]');
      const amt=Math.abs(parseFloat(inp&&inp.value)||0);
      it.qty = Math.max(0, Math.min(it.max, it.qty + (act==='inv-add'?amt:-amt)));
      it.history[it.history.length-1].q=Math.round(it.qty);
      refreshSignals(); invModal(id); render(true);
      toast((act==='inv-add'?'Received ':'Consumed ')+fmt(amt)+' '+it.unit+' · '+invDays(it).toFixed(1)+' days of cover.', invStatus(it)==='Critical'?'warn':'good'); break; }

    /* personnel */
    case 'person': personModal(id); break;
    case 'checkin': {
      const p=personById(id); p.lastCheckIn=NOW; p.expectedCheckIn=NOW+6*HOUR;
      p.movements.push({ts:NOW, place:p.location, via:'Manual check-in at command console'});
      if(p.status==='Medical Hold'){} else p.status='On Duty';
      refreshSignals(); if($('#modal-root').innerHTML) personModal(id); render(true); toast(p.name+' checked in at '+tfmt(NOW)+'.'); break; }
    case 'checkout': {
      const p=personById(id); p.status='Off-Station'; p.expectedCheckIn=NOW+6*HOUR;
      refreshSignals(); personModal(id); render(true); toast(p.name+' checked out.','warn'); break; }
    case 'report-loc': {
      const p=personById(id);
      const opts=PLACE_NAMES.filter(n=>PLACES[n].theatre===(p.expeditionId==='EXP-2027-02'?'arctic':'antarctic'));
      openModal(modalHead('Report location', p.name+' · '+p.id)+
        '<div class="p-5"><span class="eyebrow block mb-1.5">CURRENT LOCATION</span>'+
        '<select data-loc-sel="'+p.id+'" class="w-full bg-deck border border-line rounded px-3 py-2 text-[13px]">'+
        opts.map(o=>'<option '+(o===p.location?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'+
        '<p class="text-[12px] text-beam mt-2.5">Reporting a location also counts as a check-in and clears any overdue flag.</p></div>'+
        '<div class="flex justify-end gap-2 px-5 py-4 border-t border-line">'+btn('Cancel','close-modal')+btn('Report location','loc-save',{kind:'primary',icon:'pin',data:{id:p.id}})+'</div>','max-w-lg'); break; }
    case 'loc-save': {
      const p=personById(id); const sel=document.querySelector('[data-loc-sel="'+id+'"]');
      if(sel) p.location=sel.value;
      p.lastCheckIn=NOW; p.expectedCheckIn=NOW+6*HOUR;
      p.movements.push({ts:NOW, place:p.location, via:'Position report'});
      refreshSignals(); closeModal(); render(true); toast(p.name+' reported at '+p.location+'.'); break; }
    case 'contact-team': toast('Voice call placed to the field team on HF and Iridium.','warn'); break;
    case 'create-incident': {
      const p=personById(id);
      const inc={id:'INC-'+ri(4500,4599), type:'Missed Check-In', severity:'High', location:p.location, personId:p.id,
        ts:NOW, stage:2, team:null, vehicle:null,
        summary:'Escalated from automation rule PCA-02. '+p.name+' missed the '+tfmt(p.expectedCheckIn)+' check-in at '+p.location+'.', log:[]};
      for(let k=0;k<=2;k++) inc.log.push({ts:NOW+k*60000, text:WORKFLOW[k], by:'Automation PCA-02'});
      incidents.unshift(inc); refreshSignals(); go('emergency',{incident:inc.id}); toast(inc.id+' created from the overdue check-in.','bad'); break; }
    case 'person-new': toast('Personnel onboarding form is part of the HR module.'); break;
    case 'roll-call': {
      const n=personnel.filter(p=>!isOverdue(p)).length;
      toast('Roll call complete: '+n+' of '+personnel.length+' accounted for.', n===personnel.length?'good':'warn'); break; }

    /* assets */
    case 'asset-open': assetModal(id); break;
    case 'asset-new': toast('Asset registration form is part of the asset module.'); break;
    case 'maint-log': toast('Open any asset to log a completed service.'); break;
    case 'maint-remind': { const a=assets.find(x=>x.id===id); a.nextMaint=NOW+2*DAY;
      refreshSignals(); assetModal(id); render(true); toast('Maintenance reminder set for '+dfmt(a.nextMaint)+'.','warn'); break; }
    case 'maint-done': { const a=assets.find(x=>x.id===id);
      a.log.unshift({ts:NOW, kind:'Scheduled service', by:'Station Engineering', note:'Service completed, hour counter reset'});
      a.lastMaint=NOW; a.hours=0; a.condition='Good'; a.status='Operational'; a.nextMaint=NOW+120*DAY;
      refreshSignals(); assetModal(id); render(true); toast(a.id+' service recorded. Hour counter reset.'); break; }

    /* emergency */
    case 'sos': sosFlow(); break;
    case 'incident': go('emergency',{incident:id}); break;
    case 'inc-open': closeModal(); go('emergency',{incident:id}); break;
    case 'inc-assign': { const i=incidents.find(x=>x.id===id);
      const team=RESPONSE_TEAMS.find(t=>t.ready)||RESPONSE_TEAMS[0];
      const veh=assets.filter(a=>a.type==='Snow Vehicle'&&a.status==='Operational')[0];
      i.team=team.id; i.vehicle=veh?veh.id:null; i.stage=4;
      i.log.push({ts:NOW, text:WORKFLOW[3], by:'Command Centre'});
      i.log.push({ts:NOW, text:WORKFLOW[4]+' — '+team.name, by:'Command Centre'});
      refreshSignals(); render(true); toast(team.name+' assigned to '+i.id+'.'); break; }
    case 'inc-dispatch': { const i=incidents.find(x=>x.id===id); i.stage=5;
      i.log.push({ts:NOW, text:'Team Dispatched — ETA 18 minutes', by:'Command Centre'});
      refreshSignals(); render(true); toast('Team dispatched to '+i.location+'.','warn'); break; }
    case 'inc-arrived': { const i=incidents.find(x=>x.id===id); i.stage=6;
      i.log.push({ts:NOW, text:'Response Tracked — team on scene', by:'Field Report'});
      refreshSignals(); render(true); toast('Team on scene at '+i.location+'.'); break; }
    case 'inc-resolve': { const i=incidents.find(x=>x.id===id); i.stage=7;
      i.log.push({ts:NOW, text:'Incident Resolved', by:'Command Centre'});
      refreshSignals(); render(true); toast(i.id+' resolved and closed.'); break; }
    case 'inc-escalate': { const i=incidents.find(x=>x.id===id);
      i.severity = i.severity==='Medium'?'High':'Critical';
      i.log.push({ts:NOW, text:'Severity escalated to '+i.severity, by:'Command Centre'});
      refreshSignals(); render(true); toast(i.id+' escalated to '+i.severity+'.','bad'); break; }
    case 'inc-broadcast': toast('Broadcast sent to Maitri, Bharati, Himadri and all vessels.','warn'); break;

    /* reports */
    case 'gen-report': generateReport(el.getAttribute('data-r')); break;
    case 'report-sitrep': go('reports'); generateReport('sitrep'); break;
    case 'copy-report': {
      const b=state.reportOut?state.reportOut.body:'';
      try{ navigator.clipboard.writeText(b).then(function(){toast('Report copied to clipboard.');},function(){toast('Select the text to copy it.','warn');}); }
      catch(e){ toast('Select the text to copy it.','warn'); } break; }
    case 'print-report': try{ window.print(); }catch(e){ toast('Printing is not available here.','warn'); } break;
    case 'export-data': toast('Dataset export queued. In production this writes a CSV bundle.'); break;

    /* copilot */
    case 'copilot-send': sendCopilot(); break;
    case 'copilot-suggest': sendCopilot(el.getAttribute('data-q')); break;
    case 'copilot-clear': state.copilot=[]; render(); break;

    /* settings */
    case 'toggle': { const k=el.getAttribute('data-k'); state.settings[k]=!state.settings[k]; persist(); render(true);
      toast((k==='autoAlerts'?'Automatic alerts ':'Audible alarm ')+(state.settings[k]?'on.':'off.')); break; }
    case 'reset-ack': state.acked={}; refreshSignals(); persist(); render(true); toast('Acknowledgements reset.'); break;
    case 'reload': refreshSignals(); render(); toast('Dataset reloaded.'); break;
    case 'clear-storage': try{ localStorage.removeItem('polarops.v1'); }catch(e){} state.acked={}; refreshSignals(); render(true); toast('Stored preferences cleared.','warn'); break;
    default: break;
  }
});

function sendCopilot(preset){
  const inp=$('#copilot-input');
  const q = preset || (inp?inp.value.trim():'');
  if(!q) return;
  state.copilot.push({role:'user', text:q});
  const a=copilotAnswer(q);
  state.copilot.push({role:'bot', text:a.text, go:a.go});
  render();
}

/* selects + inputs */
document.addEventListener('change', function(ev){
  const sel=ev.target.closest('[data-sel]');
  if(sel){
    const k=sel.getAttribute('data-sel');
    if(k==='expedition'){ state.expedition=sel.value; render(true); toast('Current expedition set to '+expName(sel.value)+'.'); return; }
    const parts=k.split('.');
    if(parts.length===2){ state[parts[0]][parts[1]]=sel.value; persist(); render(true); }
    return;
  }
  const layer=ev.target.closest('[data-layer]');
  if(layer){ state.mapLayers[layer.getAttribute('data-layer')]=layer.checked; render(true); return; }
  const cs=ev.target.closest('[data-cargo-status]');
  if(cs){ const c=cargo.find(x=>x.id===cs.getAttribute('data-cargo-status')); c.status=cs.value;
    c.stage={'Planned':0,'Packed':0,'Dispatched':1,'In Transit':2,'Delayed':2,'Arrived':3,'Verified':3,'Stored':4}[c.status];
    c.history.forEach((h,k2)=>h.done=k2<=c.stage);
    refreshSignals(); cargoModal(c.id); render(true); toast(c.id+' set to '+c.status+'.'); return; }
  const as=ev.target.closest('[data-asset-status]');
  if(as){ const a=assets.find(x=>x.id===as.getAttribute('data-asset-status')); a.status=as.value;
    refreshSignals(); assetModal(a.id); render(true); toast(a.id+' set to '+a.status+'.'); return; }
});
let inputTimer=null;
document.addEventListener('input', function(ev){
  const inp=ev.target.closest('[data-inp]');
  if(inp){
    const k=inp.getAttribute('data-inp').split('.');
    state[k[0]][k[1]]=inp.value;
    clearTimeout(inputTimer);
    inputTimer=setTimeout(function(){
      const pos=inp.selectionStart; render(true);
      const again=document.querySelector('[data-inp="'+k.join('.')+'"]');
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    },200);
    return;
  }
  if(ev.target.id==='globalsearch') globalSearch(ev.target.value);
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Escape'){ if($('#modal-root').innerHTML){ closeModal(); } else if(state.notifOpen){ state.notifOpen=false; render(true);} }
  if(ev.key==='Enter' && ev.target.id==='copilot-input'){ sendCopilot(); }
  if(ev.key==='/' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){
    ev.preventDefault(); const g=$('#globalsearch'); if(g) g.focus();
  }
});

/* global search */
function globalSearch(q){
  const box=$('#searchresults'); if(!box) return;
  q=(q||'').trim().toLowerCase();
  if(q.length<2){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const hits=[];
  expeditions.forEach(e=>{ if((e.name+e.code+e.destination).toLowerCase().indexOf(q)>=0) hits.push(['Expedition',e.code+' · '+e.name,'exp-open',e.id,'compass']); });
  cargo.forEach(c=>{ if((c.id+c.item+c.location).toLowerCase().indexOf(q)>=0 && hits.length<40) hits.push(['Cargo',c.id+' · '+c.item,'cargo-open',c.id,'package']); });
  personnel.forEach(p=>{ if((p.name+p.id+p.role).toLowerCase().indexOf(q)>=0 && hits.length<40) hits.push(['Personnel',p.name+' · '+p.role,'person',p.id,'users']); });
  assets.forEach(a=>{ if((a.id+a.name+a.type).toLowerCase().indexOf(q)>=0 && hits.length<40) hits.push(['Asset',a.id+' · '+a.name,'asset-open',a.id,'truck']); });
  inventory.forEach(i=>{ if((i.name+i.location).toLowerCase().indexOf(q)>=0 && hits.length<40) hits.push(['Inventory',i.name+' · '+i.location,'inv-open',i.id,'boxes']); });
  incidents.forEach(i=>{ if((i.id+i.type+i.location).toLowerCase().indexOf(q)>=0 && hits.length<40) hits.push(['Incident',i.id+' · '+i.type,'incident',i.id,'siren']); });
  box.innerHTML = hits.length
    ? hits.slice(0,12).map(h=>'<button data-act="'+h[2]+'" data-id="'+esc(h[3])+'" class="w-full flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-white/5 linkish border-b border-[#152238] last:border-0">'+
        '<span class="text-beam">'+ic(h[4],'w-3.5 h-3.5')+'</span>'+
        '<span class="min-w-0"><span class="block text-[12.5px] text-frost truncate">'+esc(h[1])+'</span>'+
        '<span class="block eyebrow" style="font-size:9.5px">'+h[0].toUpperCase()+'</span></span></button>').join('')
    : '<div class="px-3 py-4 text-[12.5px] text-beam">Nothing matches that. Try a cargo ID, a person, an asset or a station.</div>';
  box.classList.remove('hidden');
}

/* ===================== INIT ===================== */
render();
setTimeout(function(){
  const crit=alerts.filter(a=>a.level==='Critical'&&!a.ack).length;
  if(crit) toast(crit+' critical alerts need attention.','bad');
},900);
})();

</script>
</body>
</html>
